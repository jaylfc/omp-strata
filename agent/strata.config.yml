# Merge these keys into ~/.omp/profiles/omp-strata/agent/config.yml.
# omp config set does that. Replacing the whole file would drop the theme.
modelRoles:
  vision: strata/qwen3.8-flash-next-coder-iq1_m
  judge: mac/google/gemma-4-12b-qat
  task: mac/google/gemma-4-12b-qat
  smol: strata/qwen3.8-flash-next-coder-iq1_m
# Smol stays on the coder. Judge and task try the Mac first.
# A failed Mac request continues on the coder.
# cooldown-expiry tries the Mac again after the suppression window.
retry:
  modelFallback: true
  fallbackChains:
    "mac/google/gemma-4-12b-qat":
      - strata/qwen3.8-flash-next-coder-iq1_m
    judge:
      - strata/qwen3.8-flash-next-coder-iq1_m
    task:
      - strata/qwen3.8-flash-next-coder-iq1_m
compaction:
  methodOrder:
    - shake
    - handoff
    - soft
  # The recent window must hold the files the model is working from, or shake drops them and the
  # model re-reads them every few minutes. A cold 98,304-token read is ~100 s. Handoff runs on the coder.
  thresholdTokens: 98304
  keepRecentTokens: 40000
  midTurnEnabled: true
  asyncEnabled: true
title:
  refreshOnReplan: false
provider:
  appendOnlyContext: "on"
tools:
  artifactSpillThreshold: 10
  artifactHeadBytes: 10
  artifactTailBytes: 10
defaultThinkingLevel: medium
startup:
  checkUpdate: false
providers:
  maxInFlightRequests:
    strata: 1
    mac: 1
