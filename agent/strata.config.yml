# Merge these keys into ~/.omp/agent/config.yml.
# omp config set does that. Replacing the whole file would drop theme and model roles.
compaction:
  methodOrder:
    - shake
    - handoff
    - soft
  # 48000 keeps a coder-only handoff from waiting until the prompt is huge.
  # When compactionModel points at a smaller side model, lower this so the
  # handoff prompt fits that model's loaded context minus maxTokens.
  thresholdTokens: 48000
  keepRecentTokens: 20000
  midTurnEnabled: true
title:
  refreshOnReplan: false
provider:
  appendOnlyContext: "on"
tools:
  artifactSpillThreshold: 10
  artifactHeadBytes: 10
  artifactTailBytes: 10
defaultThinkingLevel: low
providers:
  maxInFlightRequests:
    strata: 1
