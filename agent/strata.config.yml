# Merge these keys into ~/.omp/profiles/omp-strata/agent/config.yml.
# omp config set does that. Replacing the whole file would drop the theme.
modelRoles:
  vision: strata/qwen3.8-flash-next-coder-iq1_m
  judge: mac/prism-ml/bonsai-27b
  task: mac/prism-ml/bonsai-27b
  smol: mac/prism-ml/bonsai-27b
# The Mac is first. A failed request continues on the coder instead of dropping.
# cooldown-expiry sends the next call back to the Mac after the suppression window.
retry:
  modelFallback: true
  fallbackChains:
    "mac/prism-ml/bonsai-27b":
      - strata/qwen3.8-flash-next-coder-iq1_m
    judge:
      - strata/qwen3.8-flash-next-coder-iq1_m
    task:
      - strata/qwen3.8-flash-next-coder-iq1_m
    smol:
      - strata/qwen3.8-flash-next-coder-iq1_m
compaction:
  methodOrder:
    - shake
    - handoff
    - soft
  # 65536 stays under the 100k–160k cold-prefill range. Handoff runs on the coder.
  thresholdTokens: 65536
  keepRecentTokens: 20000
  midTurnEnabled: true
  asyncEnabled: true
title:
  refreshOnReplan: false
provider:
  appendOnlyContext: "on"
tools:
  artifactSpillThreshold: 10
  artifactHeadBytes: 10
  artifactTailBytes: 10
defaultThinkingLevel: minimal
startup:
  checkUpdate: false
providers:
  maxInFlightRequests:
    strata: 1
    mac: 1
